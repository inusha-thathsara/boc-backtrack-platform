name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  GCP_REGION: 'us-central1'
  GAR_REPO: 'backtrack-containers'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Automated Testing & Build Validation
  # ---------------------------------------------------------------------------
  validate-and-test:
    name: Build & E2E Integration Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            services/*/package.json
            web/package.json

      - name: Install Root & Services Dependencies
        run: |
          npm ci || npm install
          npm --prefix services/feed-api install
          npm --prefix services/websocket-gateway install
          npm --prefix services/media-worker install
          npm --prefix web install

      - name: Compile Backend TypeScript Microservices
        run: |
          npm --prefix services/feed-api run build
          npm --prefix services/websocket-gateway run build
          npm --prefix services/media-worker run build

      - name: Build Production Frontend Web Bundle
        run: |
          npm --prefix web run build

      - name: Launch Microservices for E2E Suite
        run: |
          node services/feed-api/dist/server.js &
          node services/websocket-gateway/dist/server.js &
          sleep 4

      - name: Execute 19-Step Integration Test Suite
        run: |
          node test-e2e.mjs

  # ---------------------------------------------------------------------------
  # 2. Terraform Infrastructure Validation
  # ---------------------------------------------------------------------------
  terraform-lint:
    name: Terraform Spec Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: |
          cd infra/terraform
          terraform fmt -check -diff

      - name: Terraform Init & Validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------------------
  # 3. Production Deployment (Cloud Run & Edge Hosting)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Google Cloud (Always Free Tier)
    needs: [validate-and-test, terraform-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Deploy Container Services to Cloud Run
        if: env.GCP_SA_KEY != ''
        run: |
          echo "Deploying microservices with scale-to-zero free tier profile..."
          gcloud builds submit services/feed-api --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/feed-api:latest
          gcloud run deploy backtrack-feed-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/feed-api:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10

          gcloud builds submit services/websocket-gateway --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/websocket-gateway:latest
          gcloud run deploy backtrack-websocket-gateway \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/websocket-gateway:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5

          gcloud builds submit services/media-worker --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/media-worker:latest
          gcloud run deploy backtrack-media-worker \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/media-worker:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Production Free-Tier Status Notification
        run: |
          echo "=========================================================="
          echo "✅ BackTrack Production CI/CD Build Completed Successfully"
          echo "   Architecture: Cloud Run (Scale-to-zero) + Firestore + GCS"
          echo "   Tier: 100% Google Cloud Always Free Tier Compliant ($0/mo)"
          echo "=========================================================="
